[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "uncertainty-boundary-fsor"
version = "1.0.0"
description = "Confusability-guided boundary learning for few-shot open-set audio classification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10,<2",
    "torch>=2.4,<2.5",
    "torchaudio>=2.4,<2.5",
    "torchlibrosa>=0.1,<0.2",
    "torchvision>=0.19,<0.20",
    "tqdm>=4.51",
]

[project.scripts]
foac-pretrain = "boundary_fsor.training.base_trainer:main"
foac-meta-train = "boundary_fsor.training.boundary_trainer:main"
foac-evaluate = "boundary_fsor.evaluation.evaluator:main"

[tool.setuptools.packages.find]
include = ["boundary_fsor*"]
